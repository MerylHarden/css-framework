<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los Angeles Login</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-500 min-h-screen flex flex-col items-center justify-center gap-8 p-6">


<div class="bg-white p-8 rounded-xl shadow-lg w-80">

<h1 class="text-2xl font-bold text-center mb-6 text-blue-600">
Los Angeles Login
</h1>

<form class="space-y-4">

<input
type="email"
placeholder="Email"
class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">

<input
type="password"
placeholder="Password"
class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">

<button
class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
Login
</button>

</form>

</div>


<img
src="LoginPage.png"
alt="Sharpen Prompt"
class="max-w-md w-full rounded-lg shadow-lg">

</body>
</html>
